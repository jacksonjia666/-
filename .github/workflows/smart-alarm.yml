name: Build Smart Sleep Alarm APK
on:
  push:
    branches: [main]
    paths:
      - 'smart-alarm/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/smart-alarm.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :smart-alarm:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: smart-sleep-alarm-apk
          path: smart-alarm/build/outputs/apk/debug/smart-alarm-debug.apk
